[project]
name = "kami-workspace"
version = "0.1.0"
description = "Kami Python workspace: entity-gate, factguard, treasury-mcp, evals"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[tool.uv.workspace]
members = ["apps/gate", "packages/factguard", "packages/treasury-mcp", "evals"]

[tool.uv]
dev-dependencies = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.13"]

[tool.pytest.ini_options]
testpaths = ["apps/gate/tests", "packages/factguard/tests", "packages/treasury-mcp/tests", "evals/tests", "profiles/templates/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
