# Hermes profile config — rendered by profiles/scripts/deploy-profile.ts. Do not hand-edit on the box.
# Runtime keys checked against installed Hermes; architecture §5.1 supplies the constraints.
# Placeholders: boulder-creek qwen3.5-9b http://127.0.0.1:8001/p/boulder-creek/v1 http://127.0.0.1:3000 https://data.bioregionaltwin.org false
model:
  default: qwen3.5-9b
  provider: custom
  api_mode: chat_completions
  base_url: http://127.0.0.1:8001/p/boulder-creek/v1          # the gate, never vLLM directly (ADR-E04)
  context_length: 65536
  reasoning_effort: low
# Never route a failed gate call directly to another model provider.
fallback_providers: []
fallback_model: []
# Hermes uses bare MCP server names in this CLI allowlist.
platform_toolsets:
  cli: [twin, platform, treasury]
memory:
  memory_enabled: false
# Preload the checked-in instructions with `hermes chat --skills entity-steward`.
# No memory/skill write-approval policy is claimed: autonomous memory is disabled,
# and filesystem/skill-management tools are outside the CLI allowlist.
mcp_servers:
  twin:
    # Public discovery is independent of the platform's configured static tree:
    # https://data.bioregionaltwin.org. Use a built local checkout for custom trees/bindings.
    # The hosted twin has no private entity registry; platform.get_needs_snapshot
    # supplies this being's scoped pulse. No npm package is published.
    type: http
    url: https://mcp.bioregionaltwin.org/mcp
    tools:
      include: [list_datasets, find_places, find_species, get_species, query_ecology, read_artifact, resolve_entity, get_reading_history, get_place, get_live, explain, get_health, compare_to_normal]
  treasury:
    type: stdio
    command: uv
    args: ["run", "treasury-mcp", "--entity", "boulder-creek"]   # holds no key (ADR-E05)
    tools:
      include: [get_balance, list_pending, propose_bounty_payout]
  platform:
    type: http
    url: http://127.0.0.1:3000/mcp
    headers:
      Authorization: "Bearer ${PLATFORM_MCP_TOKEN}"          # from the profile .env, per entity, scoped
    tools:
      include: [get_needs_snapshot, get_entity_config, list_open_bounties, draft_bounty, list_submissions, read_evidence_summary, post_update, get_strategy, get_attestation_summary]
cron:
  model: qwen3.5-9b
  max_parallel_jobs: 2            # verify: whether this applies across profiles in multiplexed mode (PRD App. C #1)
# Provisioning metadata only: stock Hermes does not enforce this field.
# The gate is authoritative for pause; scheduler jobs require a separate verified pause.
paused: false
