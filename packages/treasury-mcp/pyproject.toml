[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kami-treasury-mcp"
version = "0.1.0"
description = "Keyless stdio MCP server launched by Hermes: get_balance, list_pending, propose_bounty_payout. Holds no key, imports no signing library, cannot sign or execute (ADR-E05)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Benjamin Life" }]
dependencies = [
  "mcp==2.1.1",
  "httpx==0.28.1",
  "pydantic==2.13.5",
]

[project.scripts]
treasury-mcp = "treasury_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/treasury_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
